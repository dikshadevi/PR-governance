name: Validate PR to main

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  validate-branch-merged-with-development:
    name: Check branch already merged with development
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Configure Git user
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"

      - name: Fetch required branches
        run: |
          git fetch origin main:refs/remotes/origin/main
          git fetch origin development:refs/remotes/origin/development

      - name: Show PR details
        run: |
          echo "PR Source Branch: ${{ github.head_ref }}"
          echo "PR Target Branch: ${{ github.base_ref }}"
          echo "PR Head SHA: ${{ github.event.pull_request.head.sha }}"
          echo "Current commit:"
          git log -1 --oneline

      - name: Check PR branch changes are already merged into development
        run: |
          echo "Checking whether PR branch changes are already present in development..."

          PR_HEAD="${{ github.event.pull_request.head.sha }}"
          PR_BRANCH="${{ github.head_ref }}"

          if git merge-base --is-ancestor "$PR_HEAD" origin/development; then
            echo "Success: This PR branch is already merged into development."
          else
            echo "Error: This PR branch is not merged into development yet."
            echo ""
            echo "Before creating/merging PR to main, first merge this branch into development."
            echo ""
            echo "Required flow:"
            echo "1. Create PR: $PR_BRANCH → development"
            echo "2. Merge it into development after review/testing"
            echo "3. Then create PR: $PR_BRANCH → main"
            exit 1
          fi

      - name: Check PR branch can merge cleanly with main
        run: |
          echo "Checking whether PR branch can merge cleanly with main..."

          PR_HEAD="${{ github.event.pull_request.head.sha }}"

          git checkout -b temp-main-validation origin/main

          if git merge --no-commit --no-ff "$PR_HEAD"; then
            echo "Success: PR branch can merge cleanly with main."
            git merge --abort || true
          else
            echo "Error: PR branch has conflicts with main."
            echo ""
            echo "Please update your branch with latest main and resolve conflicts:"
            echo "git checkout ${{ github.head_ref }}"
            echo "git fetch origin"
            echo "git merge origin/main"
            echo "git push origin ${{ github.head_ref }}"
            exit 1
          fi
